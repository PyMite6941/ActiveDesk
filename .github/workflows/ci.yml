name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }} / Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm = 64-bit ARM, the same CPU family as a Raspberry Pi 4/5 on 64-bit Pi OS
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: sh build.sh
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.cmd
      - name: End-to-end self-test
        shell: bash   # pwsh splits -Djava.awt.headless=true at the dot
        run: java -Djava.awt.headless=true -jar dist/activedesk.jar selftest
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.java == '17'
        with:
          name: activedesk-jar
          path: dist/activedesk.jar
          retention-days: 14

  # Pages serves docs/ straight from main, so docs/install.* must match the root installers.
  installer-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cmp install.sh docs/install.sh && cmp install.ps1 docs/install.ps1

  # The download installers + setup wizard, run the way a user would (minus the network download).
  installer:
    name: installer ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    env:
      ACTIVEDESK_YES: '1'
      ACTIVEDESK_HOME: ${{ github.workspace }}/adhome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        shell: bash
        run: sh build.sh
      - name: install.sh (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          # stand-in so the runner doesn't actually install Tailscale
          mkdir -p "$RUNNER_TEMP/fake" && printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/fake/tailscale" && chmod +x "$RUNNER_TEMP/fake/tailscale"
          PATH="$RUNNER_TEMP/fake:$PATH" ACTIVEDESK_JAR="$PWD/dist/activedesk.jar" sh install.sh
          "$HOME/.local/bin/activedesk" version
          grep -q 'web.pinHash=' "$ACTIVEDESK_HOME/config.properties"
      - name: install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ACTIVEDESK_JAR = (Resolve-Path dist/activedesk.jar).Path
          ./install.ps1
          Get-CimInstance Win32_Process -Filter "Name='javaw.exe'" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          & "$env:LOCALAPPDATA\ActiveDesk\activedesk.cmd" version
          if (-not (Select-String -Quiet 'web.pinHash=' "$env:ACTIVEDESK_HOME\config.properties")) { exit 1 }

  # install.sh on other Linux distros, each starting WITHOUT Java: the installer must get Java
  # from that distro's package manager, set up ActiveDesk, and the installed command must pass
  # the full self-test. Plain `docker run` (not container jobs) so Alpine/musl works too.
  distros:
    name: distro ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:13
          - ubuntu:24.04
          - fedora:latest
          - rockylinux:9
          - amazonlinux:2023
          - archlinux:latest
          - opensuse/tumbleweed:latest
          - alpine:latest
          - ghcr.io/void-linux/void-glibc-full:latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: sh build.sh
      - name: install.sh + self-test in ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/w" "${{ matrix.image }}" sh /w/.github/ci/distro-test.sh
